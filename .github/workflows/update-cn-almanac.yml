name: 自动更新中国黄历

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 1 * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install lunar-python
        run: pip install lunar_python

      - name: Generate calendar
        run: python generate_cn_almanac.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cn-almanac.ics
          git diff --cached --quiet || git commit -m "自动更新中国黄历"
          git push
