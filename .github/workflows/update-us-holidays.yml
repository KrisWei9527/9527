name: 自动更新美股交易日历
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 12 *"
permissions:
  contents: write
jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
      - name: 生成中文美股交易日历 ICS
        run: python generate_us_holidays.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-holidays-cn.ics
          git diff --cached --quiet || git commit -m "自动更新美股交易日历"
          git push
